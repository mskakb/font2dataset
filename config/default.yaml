# Default configuration for font2dataset pipeline

# Character set specification
# Can be: preset name (e.g. "ascii", "hiragana"), Unicode range (e.g. "U+0041-U+005A"), or literal string
charset: ascii

# Font directory containing TTF/OTF files
font_dir: ./fonts

# Output directory for generated dataset
output_dir: ./output

# Image rendering configuration
image_size: [64, 64]      # [height, width] in pixels
font_size: 48             # font size in pixels
background: white         # background color (PIL color name or hex)
foreground: black         # foreground (text) color
padding: 4                # padding around glyph (pixels)
overflow: skip            # how to handle glyphs that don't fit: skip | shrink | scale
min_font_size: 8          # lower bound for font size when overflow=shrink
bbox_method: textbbox     # bounding box method: textbbox | pixel

# Parallel processing
workers: 4                # number of worker threads
recursive: false          # search font_dir recursively for font files

# Output format
save_png: true            # save rendered PNG images to images/
binarize_method: none     # PNG binarization: none | threshold | otsu
binarize_threshold: 0.5   # used when binarize_method=threshold (0.0-1.0)
sdf_format: none          # save Signed Distance Field: none | npy | png | both
sdf_max_dist: 10.0        # SDF clipping distance in pixels (controls border softness)
sdf_binarize_method: threshold  # SDF stroke detection: threshold | otsu
sdf_binarize_threshold: 0.5     # used when sdf_binarize_method=threshold (0.0-1.0)
