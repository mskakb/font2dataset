<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font2Dataset Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .header {
            background: white;
            border-bottom: 1px solid #ddd;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .search-box {
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .search-box input::placeholder {
            color: #999;
        }

        .container {
            display: flex;
            height: calc(100vh - 70px);
        }

        .sidebar {
            width: 200px;
            background: white;
            border-right: 1px solid #ddd;
            overflow-y: auto;
            padding: 16px;
        }

        .sidebar h2 {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 12px;
        }

        .font-list {
            list-style: none;
        }

        .font-list li {
            padding: 8px 4px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            font-size: 13px;
        }

        .font-list li:hover {
            background: #f0f0f0;
        }

        .font-list li.active {
            background: #e3f2fd;
            color: #1976d2;
            font-weight: 600;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tabs {
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 2px;
            padding: 8px 16px;
            overflow-x: auto;
        }

        .tab {
            padding: 8px 16px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s;
            color: #666;
        }

        .tab:hover {
            color: #333;
        }

        .tab.active {
            border-bottom-color: #1976d2;
            color: #1976d2;
        }

        .gallery {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .gallery-header {
            margin-bottom: 16px;
            font-size: 13px;
            color: #666;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .image-card {
            aspect-ratio: 1;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
        }

        .image-card:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 4px;
            background: white;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            font-size: 13px;
        }

        .pagination button {
            padding: 6px 10px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pagination button:hover {
            background: #f0f0f0;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .page-info {
            flex: 0 0 auto;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 24px;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            color: #333;
        }

        .modal-image {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            margin-bottom: 20px;
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 16px;
            background: #fafafa;
        }

        .modal-info {
            font-size: 13px;
        }

        .modal-info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .modal-info-row:last-child {
            border-bottom: none;
        }

        .modal-info-label {
            color: #666;
            font-weight: 500;
        }

        .modal-info-value {
            color: #333;
            font-family: monospace;
            word-break: break-all;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #f5f5f5;
        }

        .btn-primary {
            background: #1976d2;
            color: white;
            border-color: #1976d2;
        }

        .btn-primary:hover {
            background: #1565c0;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: 200px;
                border-right: none;
                border-bottom: 1px solid #ddd;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            }

            .header {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Font2Dataset Viewer</h1>
        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search by Unicode (U+0041) or character (A)..."
            >
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <h2>Fonts</h2>
            <ul class="font-list" id="fontList">
                <li class="active" data-font="*">All Fonts</li>
            </ul>
        </div>

        <div class="main-content">
            <div class="tabs" id="tabs">
                <div class="tab active" data-block="all">All</div>
                <div class="tab" data-block="ascii">ASCII</div>
                <div class="tab" data-block="digits">Digits</div>
                <div class="tab" data-block="uppercase">Uppercase</div>
                <div class="tab" data-block="lowercase">Lowercase</div>
                <div class="tab" data-block="hiragana">Hiragana</div>
                <div class="tab" data-block="katakana">Katakana</div>
                <div class="tab" data-block="cjk">CJK</div>
                <div class="tab" data-block="other">Other</div>
            </div>

            <div class="gallery">
                <div class="gallery-header" id="galleryHeader">Loading...</div>
                <div class="grid" id="grid"></div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalChar">A</div>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <img class="modal-image" id="modalImage" src="" alt="">
            <div class="modal-info">
                <div class="modal-info-row">
                    <div class="modal-info-label">File</div>
                    <div class="modal-info-value" id="modalFile">-</div>
                </div>
                <div class="modal-info-row">
                    <div class="modal-info-label">Char</div>
                    <div class="modal-info-value" id="modalCharInfo">-</div>
                </div>
                <div class="modal-info-row">
                    <div class="modal-info-label">Unicode</div>
                    <div class="modal-info-value" id="modalUnicode">-</div>
                </div>
                <div class="modal-info-row">
                    <div class="modal-info-label">Codepoint</div>
                    <div class="modal-info-value" id="modalCodepoint">-</div>
                </div>
                <div class="modal-info-row">
                    <div class="modal-info-label">Font</div>
                    <div class="modal-info-value" id="modalFont">-</div>
                </div>
            </div>
            <div class="modal-actions">
                <a class="btn btn-primary" id="downloadBtn" href="" download>Download</a>
                <button class="btn" id="closeBtn">Close</button>
            </div>
        </div>
    </div>

    <script>
        // State
        let allRecords = [];
        let filteredRecords = [];
        let selectedFonts = new Set(['*']);
        let selectedBlock = 'all';
        let searchQuery = '';
        let currentPage = 0;
        const imagesPerPage = 100;

        // Unicode block definitions
        const unicodeBlocks = {
            ascii: (cp) => cp >= 0x0020 && cp <= 0x007E,
            digits: (cp) => cp >= 0x0030 && cp <= 0x0039,
            uppercase: (cp) => cp >= 0x0041 && cp <= 0x005A,
            lowercase: (cp) => cp >= 0x0061 && cp <= 0x007A,
            hiragana: (cp) => cp >= 0x3041 && cp <= 0x3096,
            katakana: (cp) => cp >= 0x30A1 && cp <= 0x30F6,
            cjk: (cp) => cp >= 0x4E00 && cp <= 0x9FFF,
        };

        // Load metadata at startup
        async function initializeViewer() {
            try {
                const response = await fetch('/api/metadata');
                allRecords = await response.json();
                console.log(`Loaded ${allRecords.length} records`);

                // Populate font list
                await populateFontList();

                // Initial filter and render
                applyFilters();
                renderGallery();
            } catch (error) {
                console.error('Failed to load metadata:', error);
                document.getElementById('galleryHeader').textContent = 'Error loading data';
            }
        }

        async function populateFontList() {
            try {
                const response = await fetch('/api/fonts');
                const fonts = await response.json();

                const fontList = document.getElementById('fontList');
                fontList.innerHTML = '<li class="active" data-font="*">All Fonts</li>';

                fonts.forEach((font) => {
                    const li = document.createElement('li');
                    li.textContent = font;
                    li.setAttribute('data-font', font);
                    li.addEventListener('click', () => selectFont(font, li));
                    fontList.appendChild(li);
                });
            } catch (error) {
                console.error('Failed to load fonts:', error);
            }
        }

        function selectFont(font, element) {
            const allItem = document.querySelector('[data-font="*"]');

            if (font === '*') {
                selectedFonts.clear();
                selectedFonts.add('*');
                document.querySelectorAll('.font-list li').forEach((li) => {
                    li.classList.remove('active');
                });
                element.classList.add('active');
            } else {
                selectedFonts.delete('*');
                allItem.classList.remove('active');

                if (element.classList.contains('active')) {
                    element.classList.remove('active');
                    selectedFonts.delete(font);
                } else {
                    element.classList.add('active');
                    selectedFonts.add(font);
                }

                if (selectedFonts.size === 0) {
                    selectedFonts.add('*');
                    allItem.classList.add('active');
                    document.querySelectorAll('.font-list li').forEach((li) => {
                        li.classList.remove('active');
                    });
                    allItem.classList.add('active');
                }
            }

            currentPage = 0;
            applyFilters();
            renderGallery();
        }

        function selectBlock(block, element) {
            selectedBlock = block;
            document.querySelectorAll('.tab').forEach((tab) => {
                tab.classList.remove('active');
            });
            element.classList.add('active');

            currentPage = 0;
            applyFilters();
            renderGallery();
        }

        function applyFilters() {
            filteredRecords = allRecords.filter((record) => {
                // Font filter
                if (!selectedFonts.has('*') && !selectedFonts.has(record.font_path)) {
                    return false;
                }

                // Block filter
                if (selectedBlock !== 'all') {
                    const blockFilter = unicodeBlocks[selectedBlock];
                    if (!blockFilter || !blockFilter(record.codepoint)) {
                        return false;
                    }
                }

                // Search filter
                if (searchQuery) {
                    const query = searchQuery.toLowerCase();
                    const unicodeMatch = `u+${record.codepoint.toString(16).padStart(4, '0')}`.includes(query);
                    const charMatch = record.char.toLowerCase().includes(query);
                    if (!unicodeMatch && !charMatch) {
                        return false;
                    }
                }

                return true;
            });
        }

        function renderGallery() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            const start = currentPage * imagesPerPage;
            const end = start + imagesPerPage;
            const pageRecords = filteredRecords.slice(start, end);

            if (pageRecords.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🖼️</div>
                        <div>No images found</div>
                    </div>
                `;
            } else {
                pageRecords.forEach((record) => {
                    const card = document.createElement('div');
                    card.className = 'image-card';

                    const img = document.createElement('img');
                    img.src = `/images/${record.file}`;
                    img.alt = record.char;
                    img.loading = 'lazy';

                    card.appendChild(img);
                    card.addEventListener('click', () => showModal(record));
                    grid.appendChild(card);
                });
            }

            updateGalleryHeader();
            renderPagination();
        }

        function updateGalleryHeader() {
            const header = document.getElementById('galleryHeader');
            header.textContent = `${filteredRecords.length} images`;
        }

        function renderPagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            const totalPages = Math.ceil(filteredRecords.length / imagesPerPage);

            if (totalPages <= 1) {
                return;
            }

            const prevBtn = document.createElement('button');
            prevBtn.textContent = '← Previous';
            prevBtn.disabled = currentPage === 0;
            prevBtn.addEventListener('click', () => {
                if (currentPage > 0) {
                    currentPage--;
                    renderGallery();
                    document.querySelector('.gallery').scrollTop = 0;
                }
            });
            pagination.appendChild(prevBtn);

            const pageInfo = document.createElement('div');
            pageInfo.className = 'page-info';
            pageInfo.textContent = `Page ${currentPage + 1} / ${totalPages}`;
            pagination.appendChild(pageInfo);

            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next →';
            nextBtn.disabled = currentPage >= totalPages - 1;
            nextBtn.addEventListener('click', () => {
                if (currentPage < totalPages - 1) {
                    currentPage++;
                    renderGallery();
                    document.querySelector('.gallery').scrollTop = 0;
                }
            });
            pagination.appendChild(nextBtn);
        }

        function showModal(record) {
            document.getElementById('modalChar').textContent = record.char;
            document.getElementById('modalImage').src = `/images/${record.file}`;
            document.getElementById('modalFile').textContent = record.file;
            document.getElementById('modalCharInfo').textContent = record.char;
            document.getElementById('modalUnicode').textContent = record.unicode;
            document.getElementById('modalCodepoint').textContent = record.codepoint;
            document.getElementById('modalFont').textContent = record.font_path;
            document.getElementById('downloadBtn').href = `/images/${record.file}`;

            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            currentPage = 0;
            applyFilters();
            renderGallery();
        });

        document.querySelectorAll('.tab').forEach((tab) => {
            tab.addEventListener('click', (e) => {
                selectBlock(e.target.getAttribute('data-block'), e.target);
            });
        });

        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('closeBtn').addEventListener('click', closeModal);

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal')) {
                closeModal();
            }
        });

        // Initialize
        initializeViewer();
    </script>
</body>
</html>
